name: Compilar Adaptagron v2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - name: Instalar ferramentas
        run: |
          apt-get update
          apt-get install -y git build-essential libpng-dev python3 binutils-arm-none-eabi

      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Aplicar o Adaptagron
        run: |
          cat > adapt.patch <<'EOF_PATCH'
          diff --git a/graphics/pokemon/aggron/adapt.pal b/graphics/pokemon/aggron/adapt.pal
          new file mode 100644
          index 00000000..e4a90e85
          --- /dev/null
          +++ b/graphics/pokemon/aggron/adapt.pal
          @@ -0,0 +1,19 @@
          +JASC-PAL
          +0100
          +16
          +152 208 160
          +96 80 150
          +70 56 118
          +16 16 16
          +240 230 255
          +190 170 235
          +150 125 205
          +160 140 215
          +240 100 220
          +120 100 180
          +92 74 150
          +60 48 100
          +30 150 170
          +60 220 230
          +205 190 245
          +0 0 0
          diff --git a/include/battle.h b/include/battle.h
          index a4ded31b..b04a68a9 100644
          --- a/include/battle.h
          +++ b/include/battle.h
          @@ -1048,6 +1048,7 @@ extern u16 gLastPrintedMoves[MAX_BATTLERS_COUNT];
           extern u16 gLastMoves[MAX_BATTLERS_COUNT];
           extern u16 gLastLandedMoves[MAX_BATTLERS_COUNT];
           extern u16 gLastHitByType[MAX_BATTLERS_COUNT];
          +extern u32 gAdaptedTypes[MAX_BATTLERS_COUNT];
           extern u16 gLastUsedMoveType[MAX_BATTLERS_COUNT];
           extern u16 gLastResultingMoves[MAX_BATTLERS_COUNT];
           extern u16 gLockedMoves[MAX_BATTLERS_COUNT];
          diff --git a/include/constants/abilities.h b/include/constants/abilities.h
          index f54758ce..d49c2009 100644
          --- a/include/constants/abilities.h
          +++ b/include/constants/abilities.h
          @@ -341,6 +341,7 @@ enum __attribute__((packed)) Ability
               ABILITY_317 = 317,
               ABILITY_SPICY_SPRAY = 318,
               ABILITY_AURA_GUARD = 319,
          +    ABILITY_TOTAL_ADAPT,
               ABILITIES_COUNT_GEN9,
               ABILITIES_COUNT = ABILITIES_COUNT_GEN9,
           };
          diff --git a/include/constants/moves.h b/include/constants/moves.h
          index cca0f09f..fc6988b7 100644
          --- a/include/constants/moves.h
          +++ b/include/constants/moves.h
          @@ -903,6 +903,7 @@ enum __attribute__((packed)) Move
               MOVE_PSYCHIC_NOISE = 845,
               MOVE_UPPER_HAND = 846,
               MOVE_MALIGNANT_CHAIN = 847,
          +    MOVE_EXTERMINATE_BLADE = 848,
               MOVES_COUNT_GEN9,
           
               // Add any custom moves here, not further down!
          diff --git a/include/constants/species.h b/include/constants/species.h
          index bf5122e1..d2801d7c 100644
          --- a/include/constants/species.h
          +++ b/include/constants/species.h
          @@ -1692,6 +1692,7 @@ enum __attribute__((packed)) Species
           
               SPECIES_CUSTOM_START = SPECIES_GLIMMORA_MEGA,
               // Add any custom species between here and SPECIES_CUSTOM_END
          +    SPECIES_ADAPTAGRON,
               SPECIES_CUSTOM_END,
           
               SPECIES_EGG = SPECIES_CUSTOM_END,
          diff --git a/src/battle_main.c b/src/battle_main.c
          index 1139f1f7..61aa7833 100644
          --- a/src/battle_main.c
          +++ b/src/battle_main.c
          @@ -182,6 +182,7 @@ EWRAM_DATA u16 gLastPrintedMoves[MAX_BATTLERS_COUNT] = {0};
           EWRAM_DATA u16 gLastMoves[MAX_BATTLERS_COUNT] = {0};
           EWRAM_DATA u16 gLastLandedMoves[MAX_BATTLERS_COUNT] = {0};
           EWRAM_DATA u16 gLastHitByType[MAX_BATTLERS_COUNT] = {0};
          +EWRAM_DATA u32 gAdaptedTypes[MAX_BATTLERS_COUNT] = {0};
           EWRAM_DATA u16 gLastUsedMoveType[MAX_BATTLERS_COUNT] = {0};
           EWRAM_DATA u16 gLastResultingMoves[MAX_BATTLERS_COUNT] = {0};
           EWRAM_DATA u16 gLockedMoves[MAX_BATTLERS_COUNT] = {0};
          @@ -2772,6 +2773,7 @@ static void BattleStartClearSetData(void)
                   gLastMoves[i] = MOVE_NONE;
                   gLastLandedMoves[i] = MOVE_NONE;
                   gLastHitByType[i] = 0;
          +        gAdaptedTypes[i] = 0;
                   gLastUsedMoveType[i] = 0;
                   gLastResultingMoves[i] = MOVE_NONE;
                   gLastHitBy[i] = 0xFF;
          @@ -2956,6 +2958,7 @@ void SwitchInClearSetData(enum BattlerId battler, struct Volatiles *volatilesCop
           
               // Data cleared both on switch and faint
               ClearSetDataOnLeave(battler);
          +    gAdaptedTypes[battler] = 0;
           
               ClearIllusionMon(battler);
               if (effect != EFFECT_BATON_PASS)
          diff --git a/src/battle_move_resolution.c b/src/battle_move_resolution.c
          index bdf15a48..39718e33 100644
          --- a/src/battle_move_resolution.c
          +++ b/src/battle_move_resolution.c
          @@ -3820,6 +3820,8 @@ static enum MoveEndResult MoveEndUpdateLastMoves(struct BattleCalcValues *cv)
                       {
                           gLastLandedMoves[cv->battlerDef] = cv->move;
                           gLastHitByType[cv->battlerDef] = GetBattleMoveType(cv->move);
          +                if (gBattleMons[cv->battlerDef].ability == ABILITY_TOTAL_ADAPT)
          +                    gAdaptedTypes[cv->battlerDef] |= (1u << GetBattleMoveType(cv->move));
                       }
                   }
                   else
          diff --git a/src/battle_util.c b/src/battle_util.c
          index b274c388..8e71f882 100644
          --- a/src/battle_util.c
          +++ b/src/battle_util.c
          @@ -6486,6 +6486,10 @@ static inline u32 CalcMoveBasePowerAfterModifiers(struct DamageContext *ctx)
               uq4_12_t modifier = UQ_4_12(1.0);
               u32 atkSide = GetBattlerSide(battlerAtk);
           
          +    // Exterm. Blade: dobro de dano contra alvo que ja se adaptou (Total Adapt)
          +    if (move == MOVE_EXTERMINATE_BLADE && gAdaptedTypes[battlerDef] != 0)
          +        modifier = uq4_12_multiply(modifier, UQ_4_12(2.0));
          +
               // move effect
               switch (moveEffect)
               {
          @@ -8268,6 +8272,8 @@ static inline uq4_12_t CalcTypeEffectivenessMultiplierInternal(struct DamageCont
                   MulByTypeEffectiveness(ctx, &modifier, types[1]);
               if (types[2] != TYPE_MYSTERY && types[2] != types[1] && types[2] != types[0])
                   MulByTypeEffectiveness(ctx, &modifier, types[2]);
          +    if (ctx->abilities[ctx->battlerDef] == ABILITY_TOTAL_ADAPT && (gAdaptedTypes[ctx->battlerDef] & (1u << ctx->moveType)))
          +        modifier = uq4_12_multiply(modifier, UQ_4_12(0.5));
               if (ctx->moveType == TYPE_FIRE && gBattleMons[ctx->battlerDef].volatiles.tarShot)
                   modifier = uq4_12_multiply(modifier, UQ_4_12(2.0));
           
          diff --git a/src/data/abilities.h b/src/data/abilities.h
          index 56b71858..7dea4597 100644
          --- a/src/data/abilities.h
          +++ b/src/data/abilities.h
          @@ -2539,6 +2539,12 @@ const struct AbilityInfo gAbilitiesInfo[ABILITIES_COUNT] =
                   .description = COMPOUND_STRING("Ups Fire-type moves."),
               },
           
          +    [ABILITY_TOTAL_ADAPT] =
          +    {
          +        .name = _("Total Adapt"),
          +        .description = COMPOUND_STRING("Resists the last type that hit it."),
          +    },
          +
               [ABILITY_317] =
               {
                   .name = _("-------"),
          diff --git a/src/data/graphics/pokemon.h b/src/data/graphics/pokemon.h
          index 9726fafa..d9e4cec6 100644
          --- a/src/data/graphics/pokemon.h
          +++ b/src/data/graphics/pokemon.h
          @@ -11463,6 +11463,8 @@ const u32 gObjectEventPic_Substitute[] = INCGFX_COMP("graphics/pokemon/question_
           #endif //OW_PKMN_OBJECTS_SHARE_PALETTES
           #endif //OW_POKEMON_OBJECT_EVENTS
           
          +const u16 gMonPalette_Adaptagron[] = INCGFX_U16("graphics/pokemon/aggron/adapt.pal", ".gbapal");
          +
           #if !P_GBA_STYLE_SPECIES_GFX
               const u32 gMonFrontPic_Aggron[] = INCGFX_U32("graphics/pokemon/aggron/anim_front.png", ".4bpp.smol");
               const u16 gMonPalette_Aggron[] = INCGFX_U16("graphics/pokemon/aggron/normal.pal", ".gbapal");
          diff --git a/src/data/moves_info.h b/src/data/moves_info.h
          index d75670d7..9b2d1ddb 100644
          --- a/src/data/moves_info.h
          +++ b/src/data/moves_info.h
          @@ -22116,6 +22116,25 @@ const struct MoveInfo gMovesInfo[MOVES_COUNT_ALL] =
                   .battleAnimScript = gBattleAnimMove_MalignantChain,
               },
           
          +    [MOVE_EXTERMINATE_BLADE] =
          +    {
          +        .name = COMPOUND_STRING("Exterm. Blade"),
          +        .description = COMPOUND_STRING(
          +            "Slices hard. Does double\n"
          +            "damage to adapted foes."),
          +        .effect = EFFECT_HIT,
          +        .power = 90,
          +        .type = TYPE_STEEL,
          +        .accuracy = 100,
          +        .pp = 10,
          +        .target = TARGET_SELECTED,
          +        .priority = 0,
          +        .category = DAMAGE_CATEGORY_PHYSICAL,
          +        .makesContact = TRUE,
          +        .slicingMove = TRUE,
          +        .battleAnimScript = gBattleAnimMove_Cut,
          +    },
          +
               // Z-Moves
               [MOVE_BREAKNECK_BLITZ] =
               {
          diff --git a/src/data/pokemon/species_info/gen_3_families.h b/src/data/pokemon/species_info/gen_3_families.h
          index b74e2f64..0b29b919 100644
          --- a/src/data/pokemon/species_info/gen_3_families.h
          +++ b/src/data/pokemon/species_info/gen_3_families.h
          @@ -5108,6 +5108,80 @@ const struct SpeciesInfo gSpeciesInfoGen3[] =
                   .formChangeTable = sAggronFormChangeTable,
               },
           
          +    [SPECIES_ADAPTAGRON] =
          +    {
          +        .baseHP        = 80,
          +        .baseAttack    = 120,
          +        .baseDefense   = 180,
          +        .baseSpeed     = 50,
          +        .baseSpAttack  = 70,
          +        .baseSpDefense = 80,
          +        .types = MON_TYPES(TYPE_STEEL, TYPE_ROCK),
          +        .catchRate = 3,
          +    #if P_UPDATED_EXP_YIELDS >= GEN_8
          +        .expYield = 265,
          +    #elif P_UPDATED_EXP_YIELDS >= GEN_5
          +        .expYield = 239,
          +    #else
          +        .expYield = 205,
          +    #endif
          +        .evYield_Defense = 3,
          +        .itemRare = ITEM_HARD_STONE,
          +        .genderRatio = PERCENT_FEMALE(50),
          +        .eggCycles = 35,
          +        .friendship = 35,
          +        .growthRate = GROWTH_SLOW,
          +        .eggGroups = MON_EGG_GROUPS(EGG_GROUP_MONSTER),
          +        .abilities = { ABILITY_TOTAL_ADAPT, ABILITY_TOTAL_ADAPT, ABILITY_TOTAL_ADAPT },
          +        .bodyColor = BODY_COLOR_GRAY,
          +        .speciesName = _("Adaptagron"),
          +        .cryId = CRY_AGGRON,
          +        .natDexNum = NATIONAL_DEX_AGGRON,
          +        .categoryName = _("Adapt"),
          +        .height = 21,
          +        .weight = 3600,
          +        .description = COMPOUND_STRING(
          +            "Its iron horns grow longer a little at\n"
          +            "a time. They are used to determine the\n"
          +            "Aggron's age. The gouges in its armor are\n"
          +            "worn with pride as mementos from battles."),
          +        .pokemonScale = 256,
          +        .pokemonOffset = -1,
          +        .trainerScale = 350,
          +        .trainerOffset = 6,
          +        .frontPic = gMonFrontPic_Aggron,
          +        .frontPicSize = MON_COORDS_SIZE(64, 64),
          +        .frontPicYOffset = 0,
          +        .frontAnimFrames = ANIM_FRAMES(
          +            ANIMCMD_FRAME(0, 10),
          +            ANIMCMD_FRAME(1, 44),
          +            ANIMCMD_FRAME(0, 11),
          +        ),
          +        .frontAnimId = ANIM_V_SHAKE_TWICE,
          +        .backPic = gMonBackPic_Aggron,
          +        .backPicSize = MON_COORDS_SIZE(64, 56),
          +        .backPicYOffset = P_GBA_STYLE_SPECIES_GFX ? 7 : 5,
          +        .backAnimId = BACK_ANIM_V_SHAKE_LOW,
          +        .palette = gMonPalette_Adaptagron,
          +        .shinyPalette = gMonPalette_Adaptagron,
          +        .iconSprite = gMonIcon_Aggron,
          +        .iconPalIndex = 2,
          +        .pokemonJumpType = PKMN_JUMP_TYPE_NONE,
          +        SHADOW(5, 12, SHADOW_SIZE_L)
          +        FOOTPRINT(Aggron)
          +        OVERWORLD(
          +            sPicTable_Aggron,
          +            SIZE_32x32,
          +            SHADOW_SIZE_M,
          +            TRACKS_FOOT,
          +            sAnimTable_Following,
          +            gOverworldPalette_Aggron,
          +            gShinyOverworldPalette_Aggron
          +        )
          +        .levelUpLearnset = sAdaptagronLevelUpLearnset,
          +        .teachableLearnset = sAggronTeachableLearnset,
          +    },
          +
           #if P_MEGA_EVOLUTIONS
               [SPECIES_AGGRON_MEGA] =
               {
          diff --git a/src/data/wild_encounters.json b/src/data/wild_encounters.json
          index ac4c8a1f..26977bde 100755
          --- a/src/data/wild_encounters.json
          +++ b/src/data/wild_encounters.json
          @@ -16127,9 +16127,9 @@
                           "species": "SPECIES_MACHOKE"
                         },
                         {
          -                "min_level": 67,
          -                "max_level": 67,
          -                "species": "SPECIES_KADABRA"
          +                "min_level": 80,
          +                "max_level": 80,
          +                "species": "SPECIES_ADAPTAGRON"
                         },
                         {
                           "min_level": 67,
          @@ -16311,9 +16311,9 @@
                           "species": "SPECIES_MACHOKE"
                         },
                         {
          -                "min_level": 67,
          -                "max_level": 67,
          -                "species": "SPECIES_KADABRA"
          +                "min_level": 80,
          +                "max_level": 80,
          +                "species": "SPECIES_ADAPTAGRON"
                         },
                         {
                           "min_level": 67,
          diff --git a/src/pokemon.c b/src/pokemon.c
          index e6dbd661..03a5ff72 100644
          --- a/src/pokemon.c
          +++ b/src/pokemon.c
          @@ -489,6 +489,23 @@ const struct NatureInfo gNaturesInfo[NUM_NATURES] =
           #include "data/pokemon/wild_encounter_ow_behavior.h"
           #include "data/object_events/object_event_pic_tables_followers.h"
           
          +// Lista de golpes do Adaptagron (Hack)
          +static const struct LevelUpMove sAdaptagronLevelUpLearnset[] = {
          +    LEVEL_UP_MOVE( 1, MOVE_TACKLE),
          +    LEVEL_UP_MOVE( 1, MOVE_HARDEN),
          +    LEVEL_UP_MOVE( 1, MOVE_MUD_SLAP),
          +    LEVEL_UP_MOVE( 1, MOVE_HEADBUTT),
          +    LEVEL_UP_MOVE(13, MOVE_METAL_CLAW),
          +    LEVEL_UP_MOVE(17, MOVE_IRON_DEFENSE),
          +    LEVEL_UP_MOVE(25, MOVE_TAKE_DOWN),
          +    LEVEL_UP_MOVE(29, MOVE_IRON_TAIL),
          +    LEVEL_UP_MOVE(37, MOVE_PROTECT),
          +    LEVEL_UP_MOVE(45, MOVE_IRON_HEAD),
          +    LEVEL_UP_MOVE(55, MOVE_EXTERMINATE_BLADE),
          +    LEVEL_UP_MOVE(63, MOVE_DOUBLE_EDGE),
          +    LEVEL_UP_END
          +};
          +
           #include "data/pokemon/species_info.h"
           
           #define PP_UPDATE_PLACEHOLDER
          EOF_PATCH
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git apply --verbose --ignore-whitespace adapt.patch

      - name: Compilar
        run: make firered -j$(nproc)

      - name: Guardar o jogo
        uses: actions/upload-artifact@v4
        with:
          name: pokefirered-adaptagron2
          path: "*.gba"
